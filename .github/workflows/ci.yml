name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Version comes from package.json#packageManager, so the lockfile and CI
      # always agree on which pnpm produced it.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check
      - run: pnpm build
      # vite build exits 0 even when it silently drops an HTML entry, so the
      # presence of all three pages is asserted rather than assumed. What is in
      # them — ten sections, the right canonical on each route, no placeholder
      # shipped as static markup — is asserted by scripts/check-dist.mjs, which
      # `pnpm build` runs as its last step.
      - run: test -f dist/index.html && test -f dist/linter/index.html && test -f dist/404.html
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  browser:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # The scripts look for Chrome at /usr/bin/google-chrome, which
      # ubuntu-latest ships. Preview serves the built dist with the same
      # headers as production (vite.config.ts reads them from vercel.json).
      - run: |
          (pnpm preview --port 4173 --strictPort &)
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 1; done
          curl -sf http://localhost:4173/ >/dev/null
      - run: pnpm check:keyboard http://localhost:4173
      - run: pnpm audit:a11y http://localhost:4173
      - run: pnpm audit:a11y http://localhost:4173/linter
      # LH_FLOOR=0.90 is a smoke check, not the standard this site is held to.
      # `vite preview` serves HTTP/1.1, so Lighthouse's simulation queues the
      # whole request list over six connections and scores performance several
      # points below what the same build measures on production, which is
      # HTTP/2 (~100). The intended long-term gate is 0.95 against the Vercel
      # preview URL; this run only catches a collapse.
      - run: LH_RUNS=1 LH_FLOOR=0.90 pnpm check:lighthouse http://localhost:4173
      - run: LH_RUNS=1 LH_FLOOR=0.90 pnpm check:lighthouse http://localhost:4173/linter
