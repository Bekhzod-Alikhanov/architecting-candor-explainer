name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Version comes from package.json#packageManager, so the lockfile and CI
      # always agree on which pnpm produced it.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check
      - run: pnpm build
      # vite build exits 0 even when it silently drops an HTML entry, so the
      # presence of all three pages is asserted rather than assumed. What is in
      # them — ten sections, the right canonical on each route, no placeholder
      # shipped as static markup — is asserted by scripts/check-dist.mjs, which
      # `pnpm build` runs as its last step.
      - run: test -f dist/index.html && test -f dist/linter/index.html && test -f dist/404.html
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3
