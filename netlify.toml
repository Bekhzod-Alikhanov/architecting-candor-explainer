# Netlify deployment for the Architecting Candor explainer.
# Fully static: no backend, no environment variables, no build secrets.

[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# /linter is the only second entry point, so it is the only path rewritten to
# the SPA shell. A catch-all here would answer every dead URL with the full site
# and a 200, which is neither honest nor useful; anything else falls through to
# 404.html, which the build emits.
[[redirects]]
  from = "/linter"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/linter/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Hashed build assets are immutable. Fonts are content-stable and served from a
# fixed path, so they get a long cache with revalidation left to the ETag.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The explainer video is 87MB with a stable filename, so it gets a real cache
# window rather than the default revalidate-every-visit. Not `immutable`: the
# name does not change if the file is replaced, and a day of staleness is a
# cheaper mistake than an uncacheable 87MB.
[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The site loads zero third-party resources (self-hosted fonts, no analytics,
# no embeds, no inline scripts) and the video is same-origin, so a CSP this
# strict costs nothing here and makes the About copy's claim that the page
# makes no network requests after load actually enforceable. style-src-attr
# covers React's inline style="" attributes; img-src data: is the SVG grain
# background in src/styles/base.css; connect-src 'none' also blocks Vercel's
# preview toolbar (vercel.live), which is accepted. Permissions-Policy omits
# clipboard-write, fullscreen and picture-in-picture: copy-link and the video
# controls need them.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; manifest-src 'self'; connect-src 'none'; upgrade-insecure-requests"
    Permissions-Policy = "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), xr-spatial-tracking=()"
