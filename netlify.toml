# Netlify deployment for the Architecting Candor explainer.
# Fully static: no backend, no environment variables, no build secrets.

[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# /linter is the only second entry point, so it is the only path rewritten to
# the SPA shell. A catch-all here would answer every dead URL with the full site
# and a 200, which is neither honest nor useful; anything else falls through to
# 404.html, which the build emits.
[[redirects]]
  from = "/linter"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/linter/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Hashed build assets are immutable. Fonts are content-stable and served from a
# fixed path, so they get a long cache with revalidation left to the ETag.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
